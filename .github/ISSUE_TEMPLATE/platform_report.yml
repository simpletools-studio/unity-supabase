name: Platform report
description: Share a platform build, export, or runtime result
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use the [support matrix](https://github.com/simpletools-studio/unity-supabase#platform-support)
        to see which targets and behaviors have recorded results.

  - type: checkboxes
    id: no-credentials
    attributes:
      label: Credentials
      options:
        - label: I have removed every API key, JWT, refresh token, and project URL from the details below.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - WebGL
        - Windows player
        - macOS player
        - Linux player
        - Android
        - iOS
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: What did you verify?
      options:
        - Player build
        - Xcode project export
        - Player or browser run with a local fixture
        - Player or browser run against a live Supabase project
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked
        - Worked with caveats
        - Did not work
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Unity and package version
      placeholder: Unity 6000.6.7f1, package 0.9.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or browser
      placeholder: Pixel 7 (Android 14) / Firefox on Windows 11
    validations:
      required: true

  - type: checkboxes
    id: exercised
    attributes:
      label: What you exercised
      options:
        - label: Auth sign-in
        - label: OAuth via external browser
        - label: Session persistence across a restart
        - label: Database queries
        - label: Realtime subscriptions
        - label: Storage upload or download
        - label: Edge Functions

  - type: input
    id: stripping
    attributes:
      label: Managed Stripping Level
      description: Player builds only. Found under Player Settings > Other Settings.
      placeholder: Medium

  - type: textarea
    id: notes
    attributes:
      label: Caveats or failures
      description: Anything that needed a workaround, or the error if it did not work.
